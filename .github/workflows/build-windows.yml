name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v)"
        required: true
        default: "0.2.0"
      publish:
        description: "Create a GitHub release with the installers"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          node test/run.js
          node test/e2e.js
          node test/ui-smoke.js

      - name: Decide version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ github.event.inputs.publish }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer + portable zip
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis zip --x64 --publish never 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          echo "::group::Last 40 lines of the build log"
          tail -40 "$LOG"
          echo "::endgroup::"
          # surface the real error in the checks UI + API annotations
          grep -iE "error|cannot|failed|invalid|ENOENT|not found" "$LOG" | tail -12 | while IFS= read -r line; do
            echo "::error::${line//'%'/'%25'}"
          done

      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          for file in *.exe *.zip; do
            [ -f "$file" ] || continue
            sha256sum "$file" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-windows-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Write release notes
        shell: bash
        working-directory: dist
        run: |
          {
            echo "## Rafiq v${{ steps.version.outputs.version }} — Windows desktop app"
            echo
            echo "**Download \`Rafiq-Setup-${{ steps.version.outputs.version }}.exe\`** and run it."
            echo "The portable build (\`Rafiq-${{ steps.version.outputs.version }}-win-x64.zip\`) unpacks and runs without installing."
            echo
            echo "- Private, local-first coding agent: plan → build → discuss"
            echo "- Bring your own API key (OpenAI, DeepSeek, Groq, OpenRouter, NVIDIA, Ollama…)"
            echo "- Works only inside the folder you open; every turn can be undone"
            echo "- Bilingual UI (English / العربية), light & dark themes"
            echo
            echo "The installer is not code-signed yet, so Windows SmartScreen may show "Unknown publisher" — choose *More info → Run anyway*."
            echo
            echo '### Checksums'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cp "$RUNNER_TEMP/notes.md" RELEASE_NOTES.md

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Rafiq v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
